<header class="header" [class.sidebar-collapsed]="sidebarCollapsed">
  <div class="header-left">
    <button class="sidebar-toggle" (click)="toggleSidebar()" *ngIf="sidebarCollapsed">
      <i class="fas fa-bars"></i>
    </button>
    <button class="sidebar-toggle mobile-toggle" (click)="toggleSidebar()">
      <i class="fas fa-bars"></i>
    </button>
    <div class="breadcrumb">
      <span class="breadcrumb-item">Dashboard</span>
      <i class="fas fa-chevron-right breadcrumb-separator"></i>
      <span class="breadcrumb-item active">Overview</span>
    </div>
  </div>

  <div class="header-center">
    <div class="search-container">
      <div class="search-box">
        <i class="fas fa-search search-icon"></i>
        <input type="text" placeholder="Search..." class="search-input">
      </div>
    </div>
  </div>

  <div class="header-right">
    <!-- Current Time -->
    <div class="time-display">
      <i class="fas fa-clock"></i>
      <span class="time-text">{{ currentTime }}</span>
    </div>

    <!-- Notifications -->
    <div class="notification-container">
      <button class="notification-btn" (click)="toggleNotifications()">
        <i class="fas fa-bell"></i>
        <span class="notification-badge" *ngIf="getUnreadCount() > 0">{{ getUnreadCount() }}</span>
      </button>
      
      <div class="notification-dropdown" *ngIf="showNotifications">
        <div class="notification-header">
          <h3>Notifications</h3>
          <span class="notification-count">{{ getUnreadCount() }} unread</span>
        </div>
        <div class="notification-list">
          <div 
            class="notification-item" 
            *ngFor="let notification of notifications"
            [class.unread]="!notification.read"
            (click)="markNotificationAsRead(notification.id)"
          >
            <div class="notification-icon" [class]="'icon-' + notification.type">
              <i class="fas" 
                 [class.fa-shopping-cart]="notification.type === 'order'"
                 [class.fa-exclamation-triangle]="notification.type === 'warning'"
                 [class.fa-info-circle]="notification.type === 'info'">
              </i>
            </div>
            <div class="notification-content">
              <div class="notification-title">{{ notification.title }}</div>
              <div class="notification-message">{{ notification.message }}</div>
              <div class="notification-time">{{ notification.time }}</div>
            </div>
          </div>
        </div>
        <div class="notification-footer">
          <a href="#" class="view-all-link">View All Notifications</a>
        </div>
      </div>
    </div>

    <!-- User Menu -->
    <div class="user-menu-container">
      <button class="user-menu-btn" (click)="toggleUserMenu()">
        <div class="user-avatar">
          <i class="fas fa-user"></i>
        </div>
        <div class="user-info">
          <div class="user-name">{{ userName }}</div>
          <div class="user-role">{{ userRole }}</div>
        </div>
        <i class="fas fa-chevron-down user-menu-arrow"></i>
      </button>

      <div class="user-dropdown" *ngIf="showUserMenu">
        <div class="user-dropdown-header">
          <div class="user-avatar-large">
            <i class="fas fa-user"></i>
          </div>
          <div class="user-details">
            <div class="user-name-large">{{ userName }}</div>
            <div class="user-role-large">{{ userRole }}</div>
          </div>
        </div>
        <div class="user-dropdown-menu">
          <a href="#" class="dropdown-item" (click)="onProfile()">
            <i class="fas fa-user"></i>
            <span>Profile</span>
          </a>
          <a href="#" class="dropdown-item" (click)="onSettings()">
            <i class="fas fa-cog"></i>
            <span>Settings</span>
          </a>
          <a href="#" class="dropdown-item">
            <i class="fas fa-question-circle"></i>
            <span>Help & Support</span>
          </a>
          <div class="dropdown-divider"></div>
          <a href="#" class="dropdown-item logout" (click)="onLogout()">
            <i class="fas fa-sign-out-alt"></i>
            <span>Logout</span>
          </a>
        </div>
      </div>
    </div>
  </div>
</header>
