<div class="login-container">
  <!-- Semi-circular Header with Background Image -->
  <div class="header-section">
    <div class="background-image">
      <img src="https://images.unsplash.com/photo-1529156069898-49953e39b3ac?w=800&h=400&fit=crop" alt="Background" class="header-bg">
    </div>
    <div class="profile-overlay">
      <h2 class="profile-name text-danger">DukanDauri</h2>
    </div>
  </div>

  <!-- Profile Icon -->
  <div class="profile-icon-container">
    <div class="profile-icon">
      <i class="fas fa-user"></i>
    </div>
  </div>

  <!-- Login Form -->
  <div class="form-container">
    <form (ngSubmit)="onSubmit()" #loginForm="ngForm" class="login-form">
      <!-- Email Field -->
      <div class="form-group">
        <input 
          type="email" 
          class="form-control" 
          id="email"
          name="email"
          [(ngModel)]="email"
          placeholder="Your Email"
          required
        >
      </div>

      <!-- Password Field -->
      <div class="form-group">
        <input 
          type="password" 
          class="form-control" 
          id="password"
          name="password"
          [(ngModel)]="password"
          placeholder="Your Password"
          required
        >
      </div>

      <!-- Error Message -->
      <div class="error-message" *ngIf="errorMessage">
        {{ errorMessage }}
      </div>

      <!-- Login Button -->
      <button 
        type="submit" 
        class="login-btn"
        [disabled]="!email.trim() || !password.trim()"
      >
        LOGIN
      </button>
    </form>

    <!-- Registration Link -->
    <div class="registration-link">
      <span class="text-muted">Not a member yet? </span>
      <a href="#" class="join-link">Join Now!</a>
    </div>
  </div>
</div>
