<div class="unit-type-page">
  <div class="page-header">
    <h1>Unit Type Management</h1>
    <p>Manage unit types and measurements</p>
  </div>

  <div class="unit-type-content">
    <div class="unit-type-actions">
      <button class="btn btn-primary">
        <i class="fas fa-plus"></i>
        Add New Unit Type
      </button>
      <button class="btn btn-secondary">
        <i class="fas fa-sync"></i>
        Refresh
      </button>
    </div>

    <div class="unit-type-list">
      <div class="unit-type-item">
        <div class="unit-type-info">
          <div class="unit-type-icon">📏</div>
          <div class="unit-type-details">
            <h3>Length</h3>
            <p>Meter, Centimeter, Inch, Foot</p>
          </div>
        </div>
        <div class="unit-type-actions">
          <button class="btn btn-sm btn-edit">
            <i class="fas fa-edit"></i>
          </button>
          <button class="btn btn-sm btn-delete">
            <i class="fas fa-trash"></i>
          </button>
        </div>
      </div>

      <div class="unit-type-item">
        <div class="unit-type-info">
          <div class="unit-type-icon">⚖️</div>
          <div class="unit-type-details">
            <h3>Weight</h3>
            <p>Kilogram, Gram, Pound, Ounce</p>
          </div>
        </div>
        <div class="unit-type-actions">
          <button class="btn btn-sm btn-edit">
            <i class="fas fa-edit"></i>
          </button>
          <button class="btn btn-sm btn-delete">
            <i class="fas fa-trash"></i>
          </button>
        </div>
      </div>

      <div class="unit-type-item">
        <div class="unit-type-info">
          <div class="unit-type-icon">📦</div>
          <div class="unit-type-details">
            <h3>Volume</h3>
            <p>Liter, Milliliter, Gallon, Quart</p>
          </div>
        </div>
        <div class="unit-type-actions">
          <button class="btn btn-sm btn-edit">
            <i class="fas fa-edit"></i>
          </button>
          <button class="btn btn-sm btn-delete">
            <i class="fas fa-trash"></i>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
