<div class="status-page">
  <div class="page-header">
    <h1>Status Management</h1>
    <p>Manage system statuses and their configurations</p>
  </div>

  <div class="status-content">
    <div class="status-actions">
      <button class="btn btn-primary">
        <i class="fas fa-plus"></i>
        Add New Status
      </button>
      <button class="btn btn-secondary">
        <i class="fas fa-sync"></i>
        Refresh
      </button>
    </div>

    <div class="status-list">
      <div class="status-item">
        <div class="status-info">
          <div class="status-indicator active"></div>
          <div class="status-details">
            <h3>Active</h3>
            <p>System is running normally</p>
          </div>
        </div>
        <div class="status-actions">
          <button class="btn btn-sm btn-edit">
            <i class="fas fa-edit"></i>
          </button>
          <button class="btn btn-sm btn-delete">
            <i class="fas fa-trash"></i>
          </button>
        </div>
      </div>

      <div class="status-item">
        <div class="status-info">
          <div class="status-indicator inactive"></div>
          <div class="status-details">
            <h3>Inactive</h3>
            <p>System is temporarily disabled</p>
          </div>
        </div>
        <div class="status-actions">
          <button class="btn btn-sm btn-edit">
            <i class="fas fa-edit"></i>
          </button>
          <button class="btn btn-sm btn-delete">
            <i class="fas fa-trash"></i>
          </button>
        </div>
      </div>

      <div class="status-item">
        <div class="status-info">
          <div class="status-indicator pending"></div>
          <div class="status-details">
            <h3>Pending</h3>
            <p>Awaiting approval or processing</p>
          </div>
        </div>
        <div class="status-actions">
          <button class="btn btn-sm btn-edit">
            <i class="fas fa-edit"></i>
          </button>
          <button class="btn btn-sm btn-delete">
            <i class="fas fa-trash"></i>
          </button>
        </div>
      </div>

      <div class="status-item">
        <div class="status-info">
          <div class="status-indicator completed"></div>
          <div class="status-details">
            <h3>Completed</h3>
            <p>Process has been finished</p>
          </div>
        </div>
        <div class="status-actions">
          <button class="btn btn-sm btn-edit">
            <i class="fas fa-edit"></i>
          </button>
          <button class="btn btn-sm btn-delete">
            <i class="fas fa-trash"></i>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
