<div class="feedback-page">
  <div class="page-header">
    <h1>Feedback Management</h1>
    <p>Manage customer feedback and reviews</p>
  </div>

  <div class="feedback-content">
    <div class="feedback-actions">
      <button class="btn btn-primary">
        <i class="fas fa-plus"></i>
        Add New Feedback
      </button>
      <button class="btn btn-secondary">
        <i class="fas fa-sync"></i>
        Refresh
      </button>
    </div>

    <div class="feedback-list">
      <div class="feedback-item">
        <div class="feedback-info">
          <div class="feedback-icon">⭐</div>
          <div class="feedback-details">
            <h3>Product Review</h3>
            <p>Excellent product quality - 5 stars</p>
          </div>
        </div>
        <div class="feedback-actions">
          <button class="btn btn-sm btn-edit">
            <i class="fas fa-edit"></i>
          </button>
          <button class="btn btn-sm btn-delete">
            <i class="fas fa-trash"></i>
          </button>
        </div>
      </div>

      <div class="feedback-item">
        <div class="feedback-info">
          <div class="feedback-icon">💬</div>
          <div class="feedback-details">
            <h3>Service Feedback</h3>
            <p>Great customer service experience</p>
          </div>
        </div>
        <div class="feedback-actions">
          <button class="btn btn-sm btn-edit">
            <i class="fas fa-edit"></i>
          </button>
          <button class="btn btn-sm btn-delete">
            <i class="fas fa-trash"></i>
          </button>
        </div>
      </div>

      <div class="feedback-item">
        <div class="feedback-info">
          <div class="feedback-icon">🔧</div>
          <div class="feedback-details">
            <h3>Improvement Suggestion</h3>
            <p>Suggest adding more color options</p>
          </div>
        </div>
        <div class="feedback-actions">
          <button class="btn btn-sm btn-edit">
            <i class="fas fa-edit"></i>
          </button>
          <button class="btn btn-sm btn-delete">
            <i class="fas fa-trash"></i>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
