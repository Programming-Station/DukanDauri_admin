<div class="payment-mode-page">
  <div class="page-header">
    <h1>Payment Mode Management</h1>
    <p>Manage payment methods and configurations</p>
  </div>

  <div class="payment-mode-content">
    <div class="payment-mode-actions">
      <button class="btn btn-primary">
        <i class="fas fa-plus"></i>
        Add New Payment Mode
      </button>
      <button class="btn btn-secondary">
        <i class="fas fa-sync"></i>
        Refresh
      </button>
    </div>

    <div class="payment-mode-list">
      <div class="payment-mode-item">
        <div class="payment-mode-info">
          <div class="payment-mode-icon">💳</div>
          <div class="payment-mode-details">
            <h3>Credit Card</h3>
            <p>Visa, MasterCard, American Express</p>
          </div>
        </div>
        <div class="payment-mode-actions">
          <button class="btn btn-sm btn-edit">
            <i class="fas fa-edit"></i>
          </button>
          <button class="btn btn-sm btn-delete">
            <i class="fas fa-trash"></i>
          </button>
        </div>
      </div>

      <div class="payment-mode-item">
        <div class="payment-mode-info">
          <div class="payment-mode-icon">🏦</div>
          <div class="payment-mode-details">
            <h3>Bank Transfer</h3>
            <p>Direct bank transfer payments</p>
          </div>
        </div>
        <div class="payment-mode-actions">
          <button class="btn btn-sm btn-edit">
            <i class="fas fa-edit"></i>
          </button>
          <button class="btn btn-sm btn-delete">
            <i class="fas fa-trash"></i>
          </button>
        </div>
      </div>

      <div class="payment-mode-item">
        <div class="payment-mode-info">
          <div class="payment-mode-icon">💰</div>
          <div class="payment-mode-details">
            <h3>Cash on Delivery</h3>
            <p>Pay when product is delivered</p>
          </div>
        </div>
        <div class="payment-mode-actions">
          <button class="btn btn-sm btn-edit">
            <i class="fas fa-edit"></i>
          </button>
          <button class="btn btn-sm btn-delete">
            <i class="fas fa-trash"></i>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
